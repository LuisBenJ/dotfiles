# ───────── Monitor ─────────

monitor = ,1920x1080@60,auto,1


# ───────── Programs ─────────

$terminal = kitty
$files = nautilus

exec-once = $terminal
exec-once = hyprpaper
exec-once = waybar

# ───────── Environment ─────────

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


# ───────── Appearance ─────────

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(b983ffee) rgba(d08fffee) 45deg
    col.inactive_border = rgba(60456fcc)

    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(b983ff44)
    }
}

animations {
    enabled = true

    bezier = smooth, 0.25, 0.9, 0.1, 1.0

    animation = windows, 1, 5, smooth, popin 88%
    animation = windowsOut, 1, 4, smooth, popin 88%
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = border, 1, 8, smooth
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}


# ───────── Input ─────────

input {
    kb_layout = latam

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}


# ───────── Keybinds ─────────

$mod = SUPER

# Applications
bind = $mod, Q, exec, $terminal
bind = $mod, E, exec, $files

# Windows
bind = $mod, C, killactive
bind = $mod, M, exit
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, P, pseudo

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6

# Move windows to workspaces
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

# Workspace scrolling
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
